name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: smit4k/skyshot
          ref: 1f935ef46d37a37dee32123f397f3f13650d3220
          path: .skyshot-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1,wasm-bindgen@0.2.130
      - run: sh tests/admonitions.sh
      - run: sh tests/post-navigation.sh
      - run: node tests/home-sections.cjs
      - run: npm run build:wasm
        working-directory: .skyshot-source
      - run: npm run test:site
        working-directory: .skyshot-source
      - run: cp -R .skyshot-source/dist static/skyshot
      - run: zola build
      - run: node tests/skyshot.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
