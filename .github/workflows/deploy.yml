name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve-skyshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - id: resolve
        shell: bash
        run: |
          revision=$(git ls-remote --exit-code https://github.com/smit4k/skyshot.git refs/heads/main | cut -f1)
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Could not resolve the Skyshot main branch' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            published=$(curl --fail --silent --max-time 15 https://smitp.cc/skyshot/version.txt || true)
            if [[ "$revision" == "$published" ]]; then
              echo "Skyshot $revision is already live"
              exit 0
            fi
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-skyshot
    if: needs.resolve-skyshot.outputs.revision != ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: smit4k/skyshot
          ref: ${{ needs.resolve-skyshot.outputs.revision }}
          path: .skyshot-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Read Skyshot's wasm-bindgen version
        id: wasm-bindgen
        working-directory: .skyshot-source
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.lock", "rb") as lock:
              packages = tomllib.load(lock)["package"]
          version, = [package["version"] for package in packages if package["name"] == "wasm-bindgen"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
          PY
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1,wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: sh tests/admonitions.sh
      - run: sh tests/post-navigation.sh
      - run: node tests/home-sections.cjs
      - name: Download Skyshot fonts
        working-directory: .skyshot-source
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node scripts/fonts.mjs; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 15))"
            fi
          done
          exit 1
      - run: npm run build:wasm
        working-directory: .skyshot-source
      - run: npm run test:site
        working-directory: .skyshot-source
      - name: Stage Skyshot
        env:
          SKYSHOT_REVISION: ${{ needs.resolve-skyshot.outputs.revision }}
        run: |
          cp -R .skyshot-source/dist static/skyshot
          printf '%s\n' "$SKYSHOT_REVISION" > static/skyshot/version.txt
      - run: zola build
      - run: node tests/skyshot.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
