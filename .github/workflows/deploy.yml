name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
      - run: sh tests/admonitions.sh
      - run: bash tests/pds-sync.sh
      - run: zola build
      - uses: actions/upload-artifact@v4
        with:
          name: standard-site-records
          path: public/standard-site.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: standard-site-records
          path: public
      - name: Sync Standard.site records to PDS
        env:
          PDS_APP_PASSWORD: ${{ secrets.PDS_APP_PASSWORD }}
        run: bash scripts/sync-standard-site.sh
