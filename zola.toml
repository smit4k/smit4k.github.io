# The URL the site will be built for
base_url = "https://smitp.cc"
title = "Smit's Blog"
description = "Writing about software development, tools, and projects."
author = "Smit Patil"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

# Generate an RSS feed at /rss.xml
generate_feeds = true
feed_filenames = ["rss.xml", "standard-site.json"]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
standard_site_repo = "did:plc:dpce2af4fcwxc62aienkv7gu"
